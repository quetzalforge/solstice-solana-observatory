name: Refresh ecosystem snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate JSON and Markdown reports
        run: python scripts/collect.py
      - name: Commit updated snapshot
        run: |
          git config user.name "solstice-observer[bot]"
          git config user.email "solstice-observer[bot]@users.noreply.github.com"
          git add public/data/latest.json public/reports/latest.md
          git diff --cached --quiet || git commit -m "data: refresh Solana ecosystem snapshot"
          git push
